<meta charset="utf-8">
<title>岫本組裝台・原型版 v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 原型版 v3（照第九輪網站）：每一步拆成動作（放、卡、黏、鎖、焊、綁），可以播放模擬；每個接合處都附驗證結果 */
:root{
  --bg:#EEEDE8; --bar:#F7F6F2; --panel:#FBFAF7; --card:#FFFFFF; --ink:#1C1F1A; --muted:#666B60; --line:#DEDBD2; --line2:#E8E5DD;
  --sage:#5E7A55; --sage-2:#7E9A70; --sage-tint:#E4EBDF; --champ:#B08D57; --champ-tint:#F1E8D8; --ok:#3E7D52; --bad:#B4432F;
  --stage-a:#FAFAF7; --stage-b:#D9D6CD; --chip:#EFECE4; --shadow:rgba(40,48,36,.14);
  --c-fit:#5E7A55; --c-glue:#C08A1E; --c-snap:#3D6FB6; --c-screw:#5F6670; --c-wire:#C2452F; --c-tool:#7A6E5E;
  --t-fit:#E4EBDF; --t-glue:#F6EBD2; --t-snap:#E1E9F5; --t-screw:#E7E8EA; --t-wire:#F6E2DD; --t-tool:#EEEAE3;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --fs:"Noto Serif TC","Noto Sans TC",serif; --fm:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141614; --bar:#191C19; --panel:#1C1F1C; --card:#232724; --ink:#E8E6DF; --muted:#9EA296; --line:#30352F; --line2:#2A2E2A;
  --sage:#8FAE82; --sage-2:#A4C196; --sage-tint:#2A3427; --champ:#D1AC72; --champ-tint:#3A3122; --ok:#6CC08E; --bad:#EE7B69;
  --stage-a:#2C302C; --stage-b:#161916; --chip:#2B2F2B; --shadow:rgba(0,0,0,.4); color-scheme:dark;
  --c-fit:#9DBB8F; --c-glue:#E3B252; --c-snap:#86A9E0; --c-screw:#A9B0B9; --c-wire:#EE8A74; --c-tool:#B9AD9B;
  --t-fit:#263023; --t-glue:#3A3020; --t-snap:#212B3A; --t-screw:#2A2D31; --t-wire:#3A2522; --t-tool:#2E2B26}}
:root[data-theme="dark"]{
  --bg:#141614; --bar:#191C19; --panel:#1C1F1C; --card:#232724; --ink:#E8E6DF; --muted:#9EA296; --line:#30352F; --line2:#2A2E2A;
  --sage:#8FAE82; --sage-2:#A4C196; --sage-tint:#2A3427; --champ:#D1AC72; --champ-tint:#3A3122; --ok:#6CC08E; --bad:#EE7B69;
  --stage-a:#2C302C; --stage-b:#161916; --chip:#2B2F2B; --shadow:rgba(0,0,0,.4); color-scheme:dark;
  --c-fit:#9DBB8F; --c-glue:#E3B252; --c-snap:#86A9E0; --c-screw:#A9B0B9; --c-wire:#EE8A74; --c-tool:#B9AD9B;
  --t-fit:#263023; --t-glue:#3A3020; --t-snap:#212B3A; --t-screw:#2A2D31; --t-wire:#3A2522; --t-tool:#2E2B26}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--champ);outline-offset:2px}
.app{display:flex;flex-direction:column;gap:12px;height:100%;min-height:640px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 18px;border:1px solid var(--line);border-radius:16px;background:var(--bar)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand b{font-family:var(--fs);font-size:20px;letter-spacing:.08em}
.brand small{display:block;font-size:12px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .n{font-family:var(--fm);font-size:15px;color:var(--ink)}
.prog .track{width:140px;height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog .track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--sage-2));transition:width .45s ease}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--champ)}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--sage-tint);border-color:var(--sage-2)}
.btn.go{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}
.btn.gold{background:var(--champ);border-color:var(--champ);color:#fff;font-weight:600}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ico{display:inline-flex;align-items:center;gap:6px}
.btn.snd .x{display:none}.btn.snd[aria-pressed="false"] .x{display:inline}.btn.snd[aria-pressed="false"] .w{display:none}.btn.snd[aria-pressed="false"]{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.main{display:flex;gap:14px;flex:1;min-height:0}
/* 零件區 */
.lib{flex:0 0 380px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.lib .hd{padding:16px 18px 8px;display:grid;gap:4px}
.lib h2{margin:0;font-family:var(--fs);font-size:20px;display:flex;align-items:baseline;gap:10px}
.lib h2 span{font-family:var(--f);font-size:12px;color:var(--muted);font-weight:400}
.lib p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:4px 18px 14px;border-bottom:1px solid var(--line2)}
.filters button{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.grid{overflow-y:auto;padding:14px 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start;flex:1;min-height:0}
.card{position:relative;display:flex;flex-direction:column;gap:4px;padding:8px 8px 9px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 22px var(--shadow);border-color:var(--sage-2)}
.card.open{border-color:var(--champ);box-shadow:0 0 0 1px var(--champ)}
.card.now{border-color:var(--sage-2)}
.card.used{opacity:.55;cursor:pointer}
.card .nm{font-size:12.5px;line-height:1.35;min-height:34px}
.card .k{position:absolute;top:8px;left:8px;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted)}
.card .k.buy{background:var(--sage-tint);color:var(--sage)}
.card .s{position:absolute;top:8px;right:9px;font-size:11px;color:var(--muted)}
.card.used .s{color:var(--ok);font-weight:600}
.card.loading .s{color:var(--champ)}
.spin{position:relative;overflow:hidden;aspect-ratio:1;border-radius:10px;background:radial-gradient(circle at 50% 45%,var(--card),var(--chip))}
.spin img{position:absolute;left:0;top:0;height:100%;width:2400%;max-width:none;pointer-events:none;-webkit-user-drag:none}
.card:hover .spin img,.spin.auto img{animation:spin 1.6s steps(24) infinite}
.spin.auto img{animation-duration:3.2s}
@keyframes spin{to{transform:translateX(-100%)}}
.detail{grid-column:1/-1;border:1px solid var(--champ);border-radius:16px;background:var(--card);padding:14px;display:grid;gap:12px;animation:drop .26s ease-out both}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.detail .hd2{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.detail .spin{width:150px;flex-shrink:0;border-radius:12px}
.detail h3{margin:0;font-family:var(--fs);font-size:18px}
.detail dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0;font-size:13px;line-height:1.5}
.detail dt{color:var(--muted)} .detail dd{margin:0;overflow-wrap:anywhere}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip)}
.pill.buy{background:var(--sage-tint);color:var(--sage)} .pill.step{background:var(--champ-tint);color:var(--champ)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
/* 工作區 */
.stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 45% 62%,var(--stage-a) 0%,var(--stage-b) 100%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;left:14px;top:14px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 420px);z-index:3}
.views .btn{height:34px;padding:0 11px;font-size:13px;background:color-mix(in srgb,var(--card) 85%,transparent)}
.empty{position:absolute;inset:0 400px 0 0;display:grid;place-items:center;pointer-events:none;text-align:center}
.empty .ring{position:relative;width:300px;height:300px;display:grid;place-items:center}
.empty .ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed color-mix(in srgb,var(--sage) 50%,transparent);animation:rot 18s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty b{font-family:var(--fs);font-size:22px;display:block;margin-bottom:6px}
.empty span{display:block;font-size:14px;color:var(--muted);line-height:1.7}
.busy{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted);z-index:3}
.selbar{position:absolute;left:calc(50% - 200px);bottom:14px;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px var(--shadow);max-width:calc(100% - 440px);z-index:3}
.selbar .nm{font-weight:600;font-size:13px}.selbar .sub{font-size:12px;color:var(--muted)}
.toast{position:absolute;left:calc(50% - 200px);top:58px;transform:translateX(-50%);width:max-content;max-width:min(520px,calc(100% - 440px));padding:10px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 28px var(--shadow);font-size:13.5px;animation:tin .3s ease-out both;z-index:6}
.toast.ok{border-color:var(--sage-2)} .toast.bad{border-color:var(--bad);color:var(--bad)}
@keyframes tin{from{opacity:0;margin-top:-10px}to{opacity:1;margin-top:0}}
.float{position:fixed;width:96px;height:96px;padding:6px;border-radius:14px;background:var(--card);border:1px solid var(--champ);box-shadow:0 18px 36px var(--shadow);pointer-events:none;z-index:60;transform:rotate(-4deg)}
.float img{width:100%;height:100%;object-fit:contain}
/* 3D 上的動作標記 */
.marks{position:absolute;inset:0;pointer-events:none;z-index:2}
.mk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px 0 4px;border-radius:99px;border:1.5px solid var(--cc);background:color-mix(in srgb,var(--card) 92%,transparent);font-size:12px;white-space:nowrap;box-shadow:0 4px 12px var(--shadow);transition:opacity .2s,transform .2s}
.mk i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--cc);color:#fff;font-family:var(--fm);font-size:11px}
.mk.done{opacity:.6}.mk.done i{background:var(--ok)}
.mk{flex-direction:column;align-items:flex-start;height:auto;min-height:30px;padding:5px 12px 6px 6px;border-radius:14px;max-width:260px;white-space:normal}
.mk .t1{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.mk .t2{font-size:12px;line-height:1.45;color:var(--ink);padding-left:26px}
.mk::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;margin-left:-6px;background:inherit;border-right:1.5px solid var(--cc);border-bottom:1.5px solid var(--cc);transform:rotate(45deg)}
.mk{transform:translate(-50%,calc(-100% - 10px))!important}
.mk.act{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 30%,transparent),0 6px 16px var(--shadow)}
.mk.hide{opacity:0;pointer-events:none}
.solder{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;width:min(620px,calc(100% - 28px));padding:9px 12px;border-radius:16px;background:var(--card);border:1.5px solid var(--c-wire);box-shadow:0 14px 34px var(--shadow);display:grid;gap:8px}
.solder .sh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.solder .sh b{color:var(--c-wire);font-size:13px}
.solder .q{font-size:15px;line-height:1.6}
.solder .q .sw{width:28px;height:10px;margin-right:4px}
.solder .q em{font-style:normal;font-weight:700;color:var(--c-wire)}
.solder .row .btn{height:34px}
.tip{position:absolute;z-index:6;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.3);cursor:grab;touch-action:none;animation:tipb 1.2s ease-in-out infinite}
.tip:active{cursor:grabbing;animation:none}
@keyframes tipb{50%{transform:scale(1.18)}}
.padtag{position:absolute;z-index:5;transform:translate(-50%,-135%);padding:2px 7px;border-radius:7px;background:rgba(28,31,26,.88);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;border:1px solid rgba(255,255,255,.35)}
.padtag.dn{transform:translate(-50%,40%)}
.padtag.hot{background:#FF9A1A;color:#2a1600}
.padtag.off{display:none}
.padlab{position:absolute;z-index:6;transform:translate(-50%,-150%);padding:3px 8px;border-radius:8px;background:#1C1F1A;color:#fff;font-size:12px;white-space:nowrap;pointer-events:none}
.padlab.ok{background:var(--ok)} .padlab.bad{background:var(--bad)}
.hold{position:absolute;z-index:6;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:0;background:conic-gradient(var(--c-wire) calc(var(--p,0)*1turn),color-mix(in srgb,var(--card) 80%,transparent) 0);box-shadow:0 0 0 3px #fff,0 8px 20px rgba(0,0,0,.35);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);touch-action:none}
.hold span{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;line-height:1.2;text-align:center}
.acts .doit{grid-column:2;justify-self:start;height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--c-wire);background:var(--t-wire);color:var(--c-wire);font-size:12.5px;font-weight:700}
.xleg{position:absolute;left:14px;top:100px;z-index:3;width:210px;max-height:calc(100% - 190px);display:flex;flex-direction:column;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 26px var(--shadow);overflow:hidden}
.xleg .xh{padding:8px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line2);line-height:1.5}
.xleg .xl{overflow-y:auto;padding:4px}
.xleg button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border:0;border-radius:8px;background:none;font-size:12.5px;text-align:left}
.xleg button:hover{background:var(--chip)}
.xleg button.on{background:#FFE7C2;color:#7A4300;font-weight:700}
.xleg i{flex:0 0 14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
.xleg button.on i{background:#FF9A1A!important}
@media (max-width:860px){.xleg{top:56px;width:160px;max-height:42%}}
.c-fit{--cc:var(--c-fit);--ct:var(--t-fit)} .c-glue{--cc:var(--c-glue);--ct:var(--t-glue)} .c-snap{--cc:var(--c-snap);--ct:var(--t-snap)}
.c-screw{--cc:var(--c-screw);--ct:var(--t-screw)} .c-wire{--cc:var(--c-wire);--ct:var(--t-wire)} .c-tool{--cc:var(--c-tool);--ct:var(--t-tool)}
/* 說明書 */
.manual{position:absolute;right:14px;top:14px;width:380px;max-height:calc(100% - 28px);display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 97%,transparent);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px var(--shadow);overflow:hidden;z-index:4}
.manual .mh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.manual .mh .t{font-size:12px;color:var(--muted);margin-right:auto}
.manual .mh .t b{font-family:var(--fm);font-weight:500;color:var(--ink)}
.anim{position:relative;height:170px;background:radial-gradient(ellipse at 50% 60%,var(--card),var(--chip));flex-shrink:0}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.anim .mx{animation:mx 3.2s ease-in-out infinite}.anim .ma{animation:ma 3.2s ease-in-out infinite}
@keyframes mx{0%,30%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
@keyframes ma{0%,30%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.manual .mb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.manual h3{margin:0;font-family:var(--fs);font-size:19px;display:flex;align-items:baseline;gap:8px}
.manual h3 em{font-style:normal;font-family:var(--f);font-size:12px;color:var(--ok);font-weight:600}
.acts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.acts li{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:start;padding:8px 9px;border-radius:12px;border:1px solid var(--line2);background:var(--card);cursor:pointer;transition:border-color .15s,background .15s}
.acts li:hover{border-color:var(--cc)}
.acts li.cur{border-color:var(--cc);background:var(--ct);box-shadow:0 0 0 1px var(--cc)}
.acts li.done .tx{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;background:var(--ct);color:var(--cc);font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid color-mix(in srgb,var(--cc) 35%,transparent)}
.badge .n{font-family:var(--fm);font-weight:500}
.acts li.done .badge{background:var(--sage-tint);color:var(--ok);border-color:transparent}
.acts .tx{font-size:13px;line-height:1.6}
.acts .ck{grid-column:2;font-size:11.5px;color:var(--ok);display:flex;gap:4px;align-items:baseline}
.acts .ck.no{color:var(--bad)}
.acts .hint{grid-column:2;font-size:11.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px}
.legend span{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--ct);color:var(--cc);font-weight:600}
.chip{height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12px}
.chip.ok{background:var(--sage-tint);border-color:var(--sage-2)}
.dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap}
.dots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:var(--line);transition:width .25s,background .25s}
.dots button.done{background:var(--sage-2)} .dots button.cur{width:22px;background:var(--champ)}
.manual .nav{display:flex;gap:8px}.manual .nav .btn{flex:1;height:40px}
.manual.min .anim,.manual.min .mb{display:none}
.simbar{display:flex;gap:6px}
.simbar .btn{flex:1}
/* 清單 */
.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 38%,transparent);display:grid;place-items:center;padding:16px}
.sheet .box{width:min(1240px,100%);max-height:calc(100vh - 32px);background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;animation:drop .26s ease-out both}
.sheet .sh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line2)}
.sheet .sh h2{margin:0 auto 0 0;font-family:var(--fs);font-size:21px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:var(--chip)}
.seg button{height:34px;padding:0 14px;border-radius:9px;border:0;background:none}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.sheet .note{margin:0;padding:10px 22px 0;font-size:13px;color:var(--muted);line-height:1.6;max-width:90ch}
.sheet .in{overflow:auto;padding:10px 22px 22px}
.sheet table{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}
.sheet th{text-align:left;font-size:12px;color:var(--muted);padding:8px;position:sticky;top:0;background:var(--panel);z-index:1}
.sheet td{padding:6px 8px;border-top:1px solid var(--line2);vertical-align:middle}
.sheet td img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:var(--chip)}
.sheet td.m{font-family:var(--fm);font-size:12px}
.sw{display:inline-block;width:22px;height:8px;border-radius:99px;vertical-align:middle;border:1px solid var(--line)}
.vsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.vsum div{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.vsum b{display:block;font-family:var(--fm);font-size:22px;color:var(--ok)}
.vsum span{font-size:12.5px;color:var(--muted)}
.vgrp{margin:16px 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.fixlist{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px;line-height:1.6}
.calc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.calc div{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;line-height:1.7}
.misc{display:flex;flex-wrap:wrap;gap:24px}
.misc .col{flex:1 1 480px;display:grid;align-content:start}
.misc .it{display:grid;grid-template-columns:150px 170px 70px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line2);font-size:13px}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--panel);z-index:9}
[hidden]{display:none!important}
@media (max-width:1180px){.lib{flex-basis:320px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.manual{width:340px}.views{max-width:calc(100% - 380px)}.empty{inset:0 360px 0 0}}
@media (max-width:860px){
  .app{height:auto}
  .main{flex-direction:column}
  .stage{flex:none;height:66vh;min-height:440px;order:-1}
  .lib{flex:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
  .views{max-width:none;right:14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.views::-webkit-scrollbar{display:none}.views .btn{flex-shrink:0}
  .empty{inset:0 0 70px 0}
  .toast{left:50%;max-width:calc(100% - 24px)}
  .selbar{left:12px;right:12px;transform:none;max-width:none;bottom:76px;flex-wrap:nowrap;overflow-x:auto}
  .manual{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:calc(100% - 64px)}
  .manual.min .mh{border-bottom:0}
  .manual .anim{height:140px}
  .vsum,.calc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mk{height:24px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.anim .ma{opacity:1}.anim .mx{opacity:0}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 60) : ms));

// ================= 0. 音效（全部用 Web Audio 合成，不用外部檔案）
const SND = (() => {

    pick: t => tone(520, t, .09, { vol: .1, f2: 780, type: 'triangle' }),
    place: t => { tone(170, t, .17, { vol: .22, f2: 95 }); noise(t, .05, { vol: .06, freq: 900 }); },
    select: t => tone(880, t, .07, { vol: .06, type: 'triangle' }),
    near: t => tone(1320, t, .06, { vol: .045 }),
    snap: t => { noise(t, .02, { vol: .3, freq: 2600, q: 4 }); tone(320, t, .1, { vol: .16, f2: 210, type: 'triangle' }); tone(1046.5, t + .05, .32, { vol: .06 }); },
    detach: t => { tone(420, t, .12, { vol: .1, f2: 260, type: 'triangle' }); noise(t, .03, { vol: .07, freq: 1800 }); },
    bad: t => { tone(330, t, .14, { vol: .1, type: 'triangle', f2: 300 }); tone(247, t + .12, .2, { vol: .1, type: 'triangle' }); },
    step: t => [659.25, 880].forEach((f, i) => tone(f, t + i * .11, .45, { vol: .09 })),
    done: t => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * .12, .7, { vol: .09 })),
    glue: t => { noise(t, .22, { vol: .08, freq: 700, q: .8, decay: 1 }); tone(240, t, .2, { vol: .05, f2: 180 }); },
    screw: t => { for (let i = 0; i < 6; i++) noise(t + i * .07, .018, { vol: .12, freq: 4200, q: 6 }); },
    solder: t => { noise(t, .35, { vol: .06, freq: 6000, q: .6, type: 'highpass', decay: 1.2 }); tone(1900, t, .05, { vol: .03 }); },
    tie: t => { for (let i = 0; i < 9; i++) noise(t + i * .022, .012, { vol: .09, freq: 5200, q: 8 }); },
    drill: t => { tone(180, t, .5, { vol: .06, type: 'sawtooth', f2: 200, a: .04 }); noise(t, .5, { vol: .04, freq: 3000, q: .5, decay: .5 }); },
    magnet: t => { noise(t, .015, { vol: .3, freq: 1800, q: 3 }); tone(140, t, .08, { vol: .18, f2: 90 }); },

    play(n) { if (!on || !init()) return; if (ctx.state !== 'running') ctx.resume(); try { FX[n] && FX[n](ctx.currentTime + .01); } catch (e) {} },
    get on() { return on; }, set on(v) { on = v; try { localStorage.setItem('xiuben-asm-sound', v ? '1' : '0'); } catch (e) {} }

const SFX_OF = { place: 'place', push: 'place', press: 'place', thread: 'whoosh', drill: 'drill', cut: 'tap', strip: 'tap', measure: 'tap', flip: 'whoosh',
  ab: 'glue', uv: 'glue', hot: 'glue', tape: 'glue', stick: 'glue', snap: 'snap', hook: 'snap', twist: 'snap', detent: 'snap', magnet: 'magnet',
  screw: 'screw', solder: 'solder', plug: 'snap', tie: 'tie', shrink: 'solder' };

// ================= 1. 介面（只需要 parts.json 和圖片，不等 3D）
let DATA;
try { DATA = await fetch('parts.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }); }
catch (e) { $('#grid').innerHTML = '<p style="grid-column:1/-1;color:var(--bad)">零件清單讀取失敗，請重新整理頁面。</p>'; throw e; }
const P = {}, IDS = [], STEPS = DATA.steps, stepOf = {}, WIRE = {}, JOINT = {};
DATA.parts.forEach(p => { P[p.id] = p; IDS.push(p.id); p.img = `renders/${p.id}_512.webp`; p.spinImg = `renders/${p.id}_spin.webp`; });
DATA.wires.forEach(w => WIRE[w.id] = w);
DATA.joints.forEach(j => JOINT[j.id] = j);
STEPS.forEach((s, i) => {
  s.parts.forEach(id => stepOf[id] = i);
  const n = String(i + 1).padStart(2, '0'); s.x = `steps/step${n}_x_s.webp`; s.a = `steps/step${n}_a_s.webp`;
  s.unitOf = {}; (s.units || []).forEach((u, k) => u.parts.forEach(id => s.unitOf[id] = k));
});
const name = id => P[id].name;
const S = { inScene: new Set(), t: {}, gid: {}, nextG: 1, sel: null, open: null, filter: 'now', step: 0, ghost: false, wires: true, marks: true,
  loading: new Set(), actDone: new Set(), wiresOn: new Set(), curAct: -1, sim: null };
const KEY = 'xiuben-asm-v9d';   // 零件表、步驟改過（伸縮管一體、觸控 LOGO、18 步）→ 舊進度不載入
let three = null;
$('#brandSub').textContent = `原型版 v3 · ${IDS.length} 個零件 · ${STEPS.length} 步 · ${STEPS.reduce((n, s) => n + s.acts.length, 0)} 個動作`;

function toast(msg, kind, ms) { const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + (kind || ''); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms || (kind === 'bad' ? 6000 : 3200)); if (kind === 'bad') SND.play('bad'); }
function groupIds(id) { return IDS.filter(x => S.inScene.has(x) && S.gid[x] === S.gid[id]); }
const mainG = () => S.inScene.has('FRAME') ? S.gid.FRAME : -1;
function bigGroup() { const g = mainG(); return g < 0 ? 0 : IDS.filter(x => S.inScene.has(x) && S.gid[x] === g).length; }

// ---- 動作完成判斷（手動模式）：有零件的動作＝零件已經組上；單元的「裝上去」＝單元已經接到骨架；其他動作＝點一下
function actAuto(k, i) {
  const s = STEPS[k], a = s.acts[i];
  if (a.install) { const u = s.units[s.unitOf[a.parts[0]] ?? findUnit(s, i)]; return !!u && u.parts.every(id => S.inScene.has(id) && S.gid[id] === mainG()); }
  if (a.parts.length) return a.parts.every(id => S.inScene.has(id) && (id === 'FRAME' || groupIds(id).length > 1));

}
function findUnit(s, i) { for (let j = i; j >= 0; j--) { const p = s.acts[j].parts.find(id => s.unitOf[id] !== undefined); if (p) return s.unitOf[p]; } return 0; }

// ---- 零件區
function cardHTML(id) {
  const p = P[id], used = S.inScene.has(id), now = stepOf[id] === S.step, ld = S.loading.has(id);

    <div class="spin"><img src="${p.spinImg}" alt="" loading="lazy" draggable="false"></div><span class="nm">${esc(p.name)}</span>
    <span class="k ${p.kind}">${p.kind === 'buy' ? '購買' : '列印'}</span><span class="s">${ld ? '載入中' : used ? '已拿出' : '步驟 ' + (stepOf[id] + 1)}</span></button>`;
}
function detailHTML(id) {
  const p = P[id], b = p.bom, used = S.inScene.has(id);

    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <div class="row">${used ? `<button class="btn sm" data-act="find">在工作區選它</button><button class="btn sm" data-act="back">放回零件區</button>` : `<button class="btn sm go" data-act="add">放到工作區</button>`}<button class="btn sm" data-act="close">收起</button></div></div>`;
}
function visibleIds() { return IDS.filter(id => S.filter === 'all' || (S.filter === 'now' && stepOf[id] === S.step) || (S.filter === 'left' && !S.inScene.has(id)) || P[id].kind === S.filter); }

    const a = b.dataset.act, id = S.open;

    if (a === 'find') { select(id); focusOn(id); }
    if (a === 'back') { putBack(id); save(); }

  // ---- 在工作區拖動（滑鼠或手指；拖空白處＝旋轉視角）
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (S.sim || e.target !== renderer.domElement || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (S.prac) return;                                     // 練習中：拖空白處只轉視角
    const h = hitPart(e);
    if (!h) { const x = e.clientX, y = e.clientY; renderer.domElement.addEventListener('pointerup', ev => { if (Math.hypot(ev.clientX - x, ev.clientY - y) < 6) select(null); }, { once: true }); return; }
    e.stopPropagation(); e.preventDefault(); select(h.id); SND.play('select');
    const A = new Set(groupIds(h.id)), n = new THREE.Vector3(); camera.getWorldDirection(n);
    drag = { A, plane: new THREE.Plane().setFromNormalAndCoplanarPoint(n, h.point), start: h.point.clone(), t0: S.t[h.id].clone(), minY: Math.min(...[...A].map(x => P[x].min.y)), ready: false, x: e.clientX, y: e.clientY, next: h.next && h.next !== h.id ? h.next : null, moved: false };
    A.forEach(x => MAIN[x].userData.to = null); buildGhost(A);
    renderer.domElement.setPointerCapture(e.pointerId);
  }, true);
  renderer.domElement.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.moved = true;
    setRay(e); const p = new THREE.Vector3(); if (!ray.ray.intersectPlane(drag.plane, p)) return;
    const t = drag.t0.clone().add(p.sub(drag.start)); t.y = Math.max(t.y, -drag.minY);
    drag.A.forEach(x => setT(x, t)); drag.snap = bestSnap(drag.A);
    const ready = !!drag.snap && drag.snap.ok && (drag.snap.px < (MOBILE ? 46 : 34) || drag.snap.d3 < 14);
    if (ready && !drag.ready) SND.play('near');
    drag.ready = ready; setGhost(drag.snap, ready);
  });
  const endDrag = () => {
    if (!drag) return;
    if (!drag.moved) { const nx = drag.next; ghost.visible = false; drag = null; if (nx) { select(nx); SND.play('select'); } return; }
    const sn = drag.snap; ghost.visible = false;
    if (sn && (sn.px < (MOBILE ? 46 : 34) || sn.d3 < 14)) { if (sn.ok) join(drag.A, sn); else toast(sn.why, 'bad'); }
    drag = null; save(); refresh();
  };
  renderer.domElement.addEventListener('pointerup', endDrag);
  renderer.domElement.addEventListener('pointercancel', endDrag);

  // ---- 從零件區拖進來（滑鼠）
  const floatEl = document.createElement('div'); floatEl.className = 'float'; floatEl.hidden = true; floatEl.innerHTML = '<img alt="">'; document.body.appendChild(floatEl);
  function ghostPart(id, on) { MAIN[id] && MAIN[id].traverse(o => { if (!o.isMesh) return; const b = o.userData.base, m = o.userData.orig || o.material; m.transparent = on || b.tr; m.opacity = on ? .16 : b.op; m.depthWrite = !on; m.needsUpdate = true; }); }
  three = {
    cardDown(e, id) {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      e.preventDefault();
      const d = { id, x: e.clientX, y: e.clientY, started: false, placed: false };
      if (!S.inScene.has(id)) loadPart(id).catch(() => {});
      const mv = ev => {
        if (!d.started) { if (Math.hypot(ev.clientX - d.x, ev.clientY - d.y) < 6) return; if (S.inScene.has(id)) return; d.started = true; floatEl.querySelector('img').src = P[id].img; SND.play('pick'); }
        const r = renderer.domElement.getBoundingClientRect(), inside = ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom;
        const fp = inside ? floorPoint(ev) : null;
        d.lastFP = fp;
        if (fp && MAIN[id]) {
          if (!d.placed) { placeAt(id, fp); d.placed = true; select(id); refresh(); }
          const p = P[id]; setT(id, new THREE.Vector3(fp.x - p.ctr.x, -p.min.y + .5, fp.z - p.ctr.z)); floatEl.hidden = true;
        } else if (!d.placed) { floatEl.hidden = false; floatEl.style.left = (ev.clientX - 48) + 'px'; floatEl.style.top = (ev.clientY - 48) + 'px'; }
      };
      const up = () => {
        removeEventListener('pointermove', mv); removeEventListener('pointerup', up); floatEl.hidden = true;
        if (!d.started) { openCard(id); return; }
        if (!d.placed && d.lastFP) {
          const at = d.lastFP.clone();
          loadPart(id).then(() => { if (S.inScene.has(id)) return; placeAt(id, at); select(id); refresh(); save(); SND.play('place'); toast(`「${name(id)}」放進工作區了。拖動它對準機身就會吸住。`, 'ok'); }).catch(() => {});
          return;
        }
        if (d.placed) { SND.play('place'); toast(`「${name(id)}」放進工作區了。拖動它對準機身就會吸住。`, 'ok'); save(); refresh(); }
      };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    },
    clearAll() { IDS.forEach(id => { if (MAIN[id]) MAIN[id].visible = false; }); Object.values(WM).forEach(m => m.visible = false); },
    view, focusAt, effect, simulate, syncWires, showWire, solder,
    rewind(ids) {                                           // 零件沿安裝方向退出，然後回到零件區
      if (S.sel && ids.includes(S.sel)) select(null);
      ids.forEach(id => { if (!MAIN[id]) return; const out = S.t[id].clone().addScaledVector(P[id].d, Math.min(90, Math.max(40, (P[id].travel || 80) * .35))); anim(id, out); });
      syncWires();
      setTimeout(() => {
        ids.forEach(id => { if (S.inScene.has(id) && stepOf[id] >= S.step) { S.inScene.delete(id); if (MAIN[id]) { MAIN[id].visible = false; MAIN[id].userData.to = null; } delete S.gid[id]; } });
        refresh(); save();
      }, RM ? 0 : 420);
    }
  };

  // ---- 工具列
  document.querySelectorAll('#views [data-v]').forEach(b => b.onclick = () => { SND.play('tap'); view(b.dataset.v, true); });
  $('#bGhost').onclick = e => {
    S.ghost = !S.ghost; e.currentTarget.setAttribute('aria-pressed', S.ghost); SND.play('tap');
    IDS.filter(id => /^(SH[BF]_|MAG_|FOOT_)/.test(id)).forEach(id => ghostPart(id, S.ghost));
  };
  $('#bWire').onclick = e => { S.wires = !S.wires; e.currentTarget.setAttribute('aria-pressed', S.wires); SND.play('tap'); syncWires(); };
  $('#bGrav').onclick = e => {
    S.grav = S.grav === false; e.currentTarget.setAttribute('aria-pressed', S.grav); SND.play('tap');
    Object.keys(WM).forEach(id => { const m = WM[id]; wireRoot.remove(m); m.geometry.dispose(); m.material.dispose(); delete WM[id]; });
    syncWires();
    const g = DATA.grav && DATA.grav.new, o = DATA.grav && DATA.grav.old;
    toast(S.grav ? `重力狀態：線受重力實際垂下來的樣子（電腦模擬）。${g ? `套筒周圍最多垂 ${g.max} mm（上一版線夾是 ${o ? o.max : '—'} mm）` : ''}` : '規劃路徑：照說明書拉順時的位置。', 'ok', 6000);
  };
  $('#bXray').onclick = e => {
    S.xray = !S.xray; e.currentTarget.setAttribute('aria-pressed', S.xray); SND.play('tap');
    applyAll(); legend();
    toast(S.xray ? '結構模式：每個零件一個顏色、半透明；選到的那一件是實心橘黃色。' : '回到一般外觀。', 'ok');
  };
  three.legend = legend;
  $('#bMarks').onclick = e => { S.marks = !S.marks; e.currentTarget.setAttribute('aria-pressed', S.marks); SND.play('tap'); };
  addEventListener('keydown', e => {
    if ((e.key === 'x' || e.key === 'X') && document.activeElement === document.body) $('#bXray').click();
    if (e.key === 'Escape') { if (S.prac) endPractice(false); else if (S.sim) S.sim.stop = true; else select(null); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel && document.activeElement === document.body && !S.sim) { putBack(S.sel); save(); }
  });

  // ---- 還原上次進度
  if (saved && Array.isArray(saved.in) && saved.in.length) {
    const list = saved.in.filter(([id]) => P[id]);
    await loadAll(list.map(([id]) => id));
    list.forEach(([id, t, g]) => { if (!MAIN[id]) return; S.inScene.add(id); S.t[id] = new THREE.Vector3(...t); S.gid[id] = g; S.nextG = Math.max(S.nextG, g + 1); MAIN[id].visible = true; MAIN[id].position.copy(S.t[id]); });
    if (S.inScene.has('FRAME')) groupIds('FRAME').forEach(id => S.t[id].copy(S.t.FRAME));   // 同一組的零件位移要一致（修正舊版存檔）
  }
  syncWires(); S.ready = true; refresh(); view('iso', false);

  renderer.setAnimationLoop(now => {
    S.inScene.forEach(id => {
      const u = MAIN[id]?.userData; if (!u) return;
      if (u.to) { S.t[id].lerp(u.to, .22); if (S.t[id].distanceTo(u.to) < .05) { S.t[id].copy(u.to); u.to = null; } }
      MAIN[id].position.copy(S.t[id]);
    });
    if (S.sel && !S.xray && MAIN[S.sel]?.userData.lit && !RM) { const k = .42 + .14 * Math.sin(now / 260); MAIN[S.sel].traverse(o => { if (o.isMesh) (o.userData.orig || o.material).emissiveIntensity = k; }); }
    if (camTw) { const k = Math.min(1, (now - camTw.t0) / camTw.ms), e = easeIO(k); controls.target.lerpVectors(camTw.a0, camTw.a1, e); camera.position.lerpVectors(camTw.p0, camTw.p1, e); if (k >= 1) camTw = null; }
    if (glow.userData.t0) { const k = (now - glow.userData.t0) / 900; glow.material.opacity = k < 1 ? .75 * (1 - k) : 0; glow.scale.multiplyScalar(k < 1 ? 1.012 : 1); glow.lookAt(camera.position); if (k >= 1) glow.userData.t0 = 0; }
    for (let i = wireAnim.length - 1; i >= 0; i--) { const w = wireAnim[i], k = Math.min(1, (now - w.t0) / 800); w.m.geometry.setDrawRange(0, Math.floor(w.m.userData.n * k / 6) * 6); if (k >= 1) wireAnim.splice(i, 1); }
    fxGroup.children.slice().forEach(m => {
      const u = m.userData, k = (now - u.t0) / u.life; if (k < 0) { m.visible = false; return; } m.visible = true;
      if (k >= 1) { fxGroup.remove(m); m.geometry.dispose(); m.material.dispose(); return; }
      if (u.kind === 'blob') { m.scale.setScalar(.6 + .5 * Math.sin(Math.min(1, k * 2) * Math.PI / 2)); m.material.opacity = .6 * (1 - Math.max(0, k - .6) / .4); }
      else { m.scale.setScalar(1 + k * 1.5); m.material.opacity = 1 - k; }
    });
    wireRoot.position.copy(frameOff());
    controls.update(); renderer.render(scene, camera); updateMarks(); practiceFrame();
  });
} catch (err) {
  const d = document.createElement('div'); d.className = 'err';
  d.innerHTML = `<div><b style="font-family:var(--fs);font-size:20px">3D 工作區載入失敗</b><p style="color:var(--muted);line-height:1.7">零件區、說明書和清單都可以照常看。<br>請重新整理頁面再試一次。</p><button class="btn go" id="bReload">重新整理</button></div>`;
  $('#stage').appendChild(d); $('#bReload').addEventListener('click', () => location.reload()); S.ready = true; console.error(err);
}
</script>
